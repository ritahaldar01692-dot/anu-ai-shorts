<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anu AI Shorts</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#0b0b12;
  color:#fff;
}

header{
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#151522;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo span{color:#ff3b81}

.search{
  width:100%;
  max-width:500px;
  margin:20px auto;
  padding:0 15px;
}

.search input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:25px;
  background:#1d1d2a;
  color:white;
  outline:none;
}

.hero{
  margin:15px;
  padding:28px 20px;
  border-radius:20px;
  background:linear-gradient(135deg,#7b2cff,#ff277f);
}

.hero h1{font-size:28px;margin-bottom:8px}
.hero p{opacity:.9}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:10px 15px 20px;
}

.categories button{
  border:none;
  padding:10px 16px;
  border-radius:20px;
  background:#1d1d2a;
  color:white;
  white-space:nowrap;
}

.categories button.active{
  background:#ff3b81;
}

.title{
  padding:0 15px 15px;
  font-size:21px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  padding:0 15px 30px;
}

.card{
  background:#171722;
  border-radius:15px;
  overflow:hidden;
}

.card video{
  width:100%;
  aspect-ratio:9/16;
  object-fit:cover;
  background:#050509;
}

.info{
  padding:12px;
}

.info h3{
  font-size:15px;
  margin-bottom:6px;
}

.info p{
  color:#aaa;
  font-size:12px;
  margin-bottom:10px;
}

.actions{
  display:flex;
  gap:6px;
}

.actions button{
  flex:1;
  padding:8px 4px;
  border:none;
  border-radius:8px;
  background:#262636;
  color:white;
}

.empty{
  text-align:center;
  padding:40px 20px;
  color:#aaa;
  grid-column:1/-1;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.92);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{display:flex}

.modal-box{
  width:100%;
  max-width:430px;
  position:relative;
}

.modal video{
  width:100%;
  max-height:80vh;
  border-radius:15px;
  background:black;
}

.close{
  position:absolute;
  right:5px;
  top:-45px;
  border:none;
  background:#ff3b81;
  color:white;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:20px;
}

.modal-info{
  padding-top:12px;
}

@media(max-width:600px){
  .grid{grid-template-columns:repeat(2,1fr)}
}

@media(min-width:800px){
  .grid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>

<body>

<header>
  <div class="logo">✨ Anu <span>AI Shorts</span></div>
</header>

<div class="search">
  <input id="searchInput" type="text" placeholder="Search videos...">
</div>

<section class="hero">
  <h1>Watch. Feel. Share. ❤️</h1>
  <p>Discover amazing AI Shorts videos.</p>
</section>

<div class="categories" id="categories">
  <button class="active" data-category="All">All</button>
  <button data-category="Love">❤️ Love</button>
  <button data-category="Sad">😢 Sad</button>
  <button data-category="Funny">😂 Funny</button>
  <button data-category="Attitude">😎 Attitude</button>
  <button data-category="Horror">👻 Horror</button>
  <button data-category="Animals">🐶 Animals</button>
  <button data-category="Birds">🐦 Birds</button>
  <button data-category="Wildlife">🦁 Wildlife</button>
  <button data-category="City">🏙️ City</button>
  <button data-category="Village">🌾 Village</button>
  <button data-category="Fantasy">🧚 Fantasy</button>
  <button data-category="Motivation">🔥 Motivation</button>
</div>

<h2 class="title">Latest Shorts</h2>

<div class="grid" id="shortsGrid"></div>

<div class="modal" id="videoModal">
  <div class="modal-box">
    <button class="close" onclick="closeModal()">×</button>
    <video id="modalVideo" controls autoplay></video>
    <div class="modal-info">
      <h2 id="modalTitle"></h2>
      <p id="modalDescription"></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://kjuejpzpigkbhjxkksml.supabase.co";

const SUPABASE_KEY =
"sb_publishable_QUcBfXi4cAkkXNf08g_nyQ_FA6sgtvh";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let shorts = [];
let currentCategory = "All";
let currentVideo = null;


/* DEMO VIDEOS */
const demoVideos = [
  {
    id:"demo1",
    title:"A Little Dog With a Big Heart 🐶❤️",
    description:"A cute and emotional AI short.",
    category:"Animals",
    video:"",
    thumbnail:"",
    views:"0",
    likes:"0"
  },
  {
    id:"demo2",
    title:"Beautiful Love Story ❤️",
    description:"A romantic AI short.",
    category:"Love",
    video:"",
    thumbnail:"",
    views:"0",
    likes:"0"
  }
];


/* LOAD VIDEOS FROM SUPABASE */
async function loadVideos(){

  const grid = document.getElementById("shortsGrid");

  grid.innerHTML =
    '<div class="empty">Loading videos...</div>';

  const { data, error } = await supabaseClient
    .from("Videos")
    .select("*")
    .order("created_at", { ascending:false });

  if(error){

    console.error("Supabase Error:",error);

    shorts = demoVideos;
    renderShorts();
    return;
  }

  if(data && data.length > 0){

    shorts = data.map(item => ({
      id:item.id,
      title:item.title || "Untitled Video",
      description:item.description || "",
      category:item.category || "General",
      video:item.video_url || "",
      thumbnail:item.thumbnail_url || "",
      views:item.views || "0",
      likes:item.likes || "0"
    }));

  }else{

    shorts = demoVideos;

  }

  renderShorts();
}


/* RENDER VIDEOS */
function renderShorts(){

  const grid = document.getElementById("shortsGrid");
  const search =
    document.getElementById("searchInput").value
    .toLowerCase();

  const filtered = shorts.filter(video => {

    const categoryMatch =
      currentCategory === "All" ||
      video.category === currentCategory;

    const searchMatch =
      video.title.toLowerCase().includes(search) ||
      video.description.toLowerCase().includes(search);

    return categoryMatch && searchMatch;

  });


  if(filtered.length === 0){

    grid.innerHTML =
      '<div class="empty">No videos found 😔</div>';

    return;
  }


  grid.innerHTML = filtered.map(video => {

    const safeVideo =
      escapeAttribute(video.video);

    return `
      <div class="card">

        <video
          src="${safeVideo}"
          muted
          playsinline
          preload="metadata"
          onclick="openVideo('${video.id}')">
        </video>

        <div class="info">

          <h3>${escapeHTML(video.title)}</h3>

          <p>${escapeHTML(video.description)}</p>

          <div class="actions">

            <button onclick="likeVideo('${video.id}')">
              ❤️ ${video.likes}
            </button>

            <button onclick="saveVideo('${video.id}')">
              🔖 Save
            </button>

            <button onclick="shareVideo('${video.id}')">
              ↗ Share
            </button>

          </div>

        </div>

      </div>
    `;

  }).join("");
}


/* OPEN VIDEO */
function openVideo(id){

  const video =
    shorts.find(v => String(v.id) === String(id));

  if(!video || !video.video){
    alert("This video does not have a valid video URL yet.");
    return;
  }

  currentVideo = video;

  document.getElementById("modalVideo").src =
    video.video;

  document.getElementById("modalTitle").textContent =
    video.title;

  document.getElementById("modalDescription").textContent =
    video.description;

  document.getElementById("videoModal")
    .classList.add("show");
}


/* CLOSE VIDEO */
function closeModal(){

  const player =
    document.getElementById("modalVideo");

  player.pause();
  player.src="";

  document.getElementById("videoModal")
    .classList.remove("show");
}


/* LIKE */
function likeVideo(id){

  const video =
    shorts.find(v => String(v.id) === String(id));

  if(video){

    let likes =
      parseInt(video.likes) || 0;

    video.likes =
      String(likes + 1);

    renderShorts();

  }
}


/* SAVE */
function saveVideo(id){

  const saved =
    JSON.parse(
      localStorage.getItem("savedVideos") || "[]"
    );

  if(!saved.includes(id)){

    saved.push(id);

    localStorage.setItem(
      "savedVideos",
      JSON.stringify(saved)
    );

    alert("Video saved 🔖");

  }else{

    alert("Already saved 🔖");

  }
}


/* SHARE */
async function shareVideo(id){

  const video =
    shorts.find(v => String(v.id) === String(id));

  if(!video) return;

  const shareData = {
    title:video.title,
    text:video.description,
    url:video.video || location.href
  };

  try{

    if(navigator.share){

      await navigator.share(shareData);

    }else{

      await navigator.clipboard.writeText(
        video.video || location.href
      );

      alert("Link copied 📋");

    }

  }catch(e){

    console.log(e);

  }
}


/* SEARCH */
document
  .getElementById("searchInput")
  .addEventListener("input",renderShorts);


/* CATEGORY */
document
  .getElementById("categories")
  .addEventListener("click",function(e){

    if(e.target.tagName !== "BUTTON") return;

    document
      .querySelectorAll(".categories button")
      .forEach(btn => btn.classList.remove("active"));

    e.target.classList.add("active");

    currentCategory =
      e.target.dataset.category;

    renderShorts();

  });


/* ESCAPE HTML */
function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ESCAPE ATTRIBUTE */
function escapeAttribute(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* START */
loadVideos();

</script>

</body>
</html>
